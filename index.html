
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Eletrônicos</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header class="topo">
        <h1>Catálogo de Eletrônicos</h1>
        <p>Análise de produtos e preços</p>
    </header>

    <main class="container">

        <section>
            <h2>Resumo dos Produtos</h2>
            <div id="resumo" class="resumo"></div>
        </section>

        <section>
            <h2>Todos os Produtos</h2>
            <div id="resultado" class="lista-produtos"></div>
        </section>

        <section>
            <h2>Produtos Baratos</h2>
            <p id="quantidade-baratos"></p>
            <div id="produtos-baratos" class="lista-produtos"></div>
        </section>

    </main>

    <footer>
        <p>Projeto Integrador - Catálogo de Eletrônicos</p>
    </footer>

</body>
</html>
